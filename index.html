<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Is Dice and Slice Open?</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #fff;
  }

  .app {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 24px;
    padding: 48px 36px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
  }

  .logo {
    font-size: 56px;
    margin-bottom: 16px;
  }

  h1 {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }

  .subtitle {
    font-size: 15px;
    color: rgba(255, 255, 255, 0.6);
    margin-bottom: 36px;
  }

  button.check {
    background: linear-gradient(135deg, #e94560 0%, #f27121 100%);
    color: #fff;
    border: none;
    padding: 18px 36px;
    font-size: 18px;
    font-weight: 600;
    border-radius: 14px;
    cursor: pointer;
    width: 100%;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 8px 20px rgba(233, 69, 96, 0.35);
  }

  button.check:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px rgba(233, 69, 96, 0.45);
  }

  button.check:active {
    transform: translateY(0);
  }

  .result {
    margin-top: 32px;
    padding: 28px 20px;
    border-radius: 16px;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  .result.show {
    opacity: 1;
    transform: translateY(0);
  }

  .result.yes {
    background: rgba(46, 204, 113, 0.18);
    border: 1px solid rgba(46, 204, 113, 0.4);
  }

  .result.no {
    background: rgba(231, 76, 60, 0.18);
    border: 1px solid rgba(231, 76, 60, 0.4);
  }

  .answer {
    font-size: 42px;
    font-weight: 800;
    margin-bottom: 8px;
    letter-spacing: -1px;
  }

  .result.yes .answer { color: #2ecc71; }
  .result.no .answer { color: #e74c3c; }

  .time {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.7);
  }
</style>
</head>
<body>
  <div class="app">
    <div class="logo">🎲🍕</div>
    <h1>Is Dice and Slice Open?</h1>
    <p class="subtitle">Tap the button to find out.</p>

    <button class="check" id="checkBtn">Check now</button>

    <div class="result" id="result">
      <div class="answer" id="answer"></div>
      <div class="time" id="time"></div>
    </div>
  </div>

  <script>
    const btn = document.getElementById('checkBtn');
    const result = document.getElementById('result');
    const answer = document.getElementById('answer');
    const time = document.getElementById('time');

    btn.addEventListener('click', () => {
      const now = new Date();
      const isOpen = now.getHours() >= 12;

      result.classList.remove('show', 'yes', 'no');
      void result.offsetWidth;

      if (isOpen) {
        answer.textContent = 'Yes!';
        result.classList.add('yes');
      } else {
        answer.textContent = 'Not yet';
        result.classList.add('no');
      }

      const hh = now.getHours().toString().padStart(2, '0');
      const mm = now.getMinutes().toString().padStart(2, '0');
      time.textContent = `Checked at ${hh}:${mm}`;
      result.classList.add('show');
    });
  </script>
</body>
</html>
